# Development broker: only the LoRaWAN simulator publishes here; real nodes arrive
# through The Things Network (see docs/adr/0002).

listener 1883

# No credentials in development: the port is published on localhost only
# (docker-compose.yml). Production must use a password file and an ACL.
allow_anonymous true

# Keeps queued QoS 1 messages and persistent sessions across a restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
